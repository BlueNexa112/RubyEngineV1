<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deskripsi Produk · ToolKit</title>
<style>
:root{--bg:#04121a;--card:#0a2030;--fg:#e0f4ff;--mut:#5d8ba8;--acc:#22d3ee;--acc2:#38bdf8;--line:rgba(34,211,238,.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#0a2a3d,#04121a 65%);color:var(--fg);min-height:100dvh;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
h1{font-size:17px;font-weight:700}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.f input,.f textarea{width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:15px;font-family:inherit;font-weight:600;resize:vertical}
.f textarea{min-height:60px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--acc)}
.go{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121a;font-size:15px;font-weight:800;border:none;font-family:inherit;box-shadow:0 8px 24px rgba(34,211,238,.3);margin-bottom:10px}
.go:active{transform:scale(.97)}
.cp{width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:14px;font-weight:600;font-family:inherit;margin-bottom:14px}
.res{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
</style></head><body>
<div class="top"><a class="back" href="../apk.html">←</a><h1>Deskripsi Produk</h1></div>
<div class="f"><label>Nama produk</label><input id="n" placeholder="Kopi Arabika Gayo"></div>
<div class="f"><label>Kategori</label><input id="k" placeholder="Minuman / Skincare"></div>
<div class="f"><label>Keunggulan (pisah koma)</label><textarea id="kl" rows="2" placeholder="aroma kuat, tanpa gula, kemasan 250gr"></textarea></div>
<div class="f"><label>Info tambahan (opsional)</label><textarea id="tb" rows="2" placeholder="Bisa COD, gratis ongkir"></textarea></div>
<button class="go" id="gen">✨ Generate Deskripsi</button>
<button class="cp" id="cp">📋 Copy Hasil</button>
<div class="res" id="out">Hasil akan muncul di sini…</div>
<script src="../js/sfx.js"></script>
<script>
document.getElementById('gen').addEventListener('click',function(){
  var n=document.getElementById('n').value.trim()||'Produk';
  var k=document.getElementById('k').value.trim()||'kategori';
  var kl=document.getElementById('kl').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
  var tb=document.getElementById('tb').value.trim();
  var t='🌟 '+n+' 🌟\n\n';
  t+='Hadir sebagai pilihan terbaik di kategori '+k+', '+n+' dirancang untuk memberikan pengalaman maksimal bagi Anda.\n\n';
  t+='Keunggulan utama:\n';
  if(kl.length) kl.forEach(function(x){t+='• '+x.charAt(0).toUpperCase()+x.slice(1)+'\n'});
  else t+='• Kualitas premium\n• Harga terjangkau\n• Cocok untuk sehari-hari\n';
  t+='\n'+n+' menjadi solusi tepat untuk kebutuhan '+k+' Anda. Dibuat dengan standar kualitas tinggi dan perhatian pada setiap detail.';
  if(tb) t+='\n\n📌 '+tb;
  t+='\n\nPesan sekarang dan rasakan bedanya!';
  document.getElementById('out').textContent=t;SFX.ok();
});
document.getElementById('cp').addEventListener('click',function(){
  var t=document.getElementById('out').textContent;
  navigator.clipboard&&navigator.clipboard.writeText(t);
  this.textContent='✓ Tersalin';SFX.pickup();
  var s=this;setTimeout(function(){s.textContent='📋 Copy Hasil'},1300);
});
</script></body></html>
