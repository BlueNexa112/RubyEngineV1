<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nickname Store · ToolKit</title>
<style>
:root{--bg:#100826;--card:#1d1140;--fg:#f1ecff;--mut:#9184c9;--acc:#a78bfa;--acc2:#f472b6;--line:rgba(167,139,250,.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#26145c,#100826 65%);color:var(--fg);min-height:100dvh;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
h1{font-size:17px;font-weight:700}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.f input,.f select{width:100%;padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:15px;font-family:inherit;font-weight:600;appearance:none}
.f input:focus,.f select:focus{outline:none;border-color:var(--acc)}
.go{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#100826;font-size:15px;font-weight:700;border:none;font-family:inherit;box-shadow:0 8px 24px rgba(167,139,250,.35);margin-bottom:16px}
.go:active{transform:scale(.97)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.item span{font-size:14px;font-weight:600;word-break:break-word;flex:1}
.cp{padding:9px 14px;border-radius:10px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.35);color:var(--acc);font-size:12px;font-weight:700;font-family:inherit;transition:.2s}
.cp.ok{background:rgba(61,220,132,.15);color:#3ddc84;border-color:rgba(61,220,132,.4)}
</style></head><body>
<div class="top"><a class="back" href="../apk.html">←</a><h1>Nickname Store</h1></div>
<div class="f"><label>Kata dasar</label><input id="k" placeholder="kopi, sneaker, hijab…"></div>
<div class="f"><label>Gaya</label>
<select id="s">
<option value="modern">Modern</option><option value="kekinian">Kekinian</option>
<option value="klasik">Klasik</option><option value="unik">Unik</option>
</select></div>
<button class="go" id="gen">✨ Generate 6 Nama</button>
<div id="out"></div>
<script src="../js/sfx.js"></script>
<script>
(function(){
var P={modern:['Nova','Lux','Prime','Zea','Aero','Meta'],kekinian:['Kuy','Vibes','Gas','Santuy','Cuan','Mantul'],klasik:['Toko','Kedai','Warung','Griya','Bakti','Saudara'],unik:['Kibo','Zoro','Xylo','Quirk','Nebu','Pixel']};
var S={modern:['Store','Hub','Point','Space','Zone'],kekinian:['Gacor','Kekinian','Mania','Viral','Hits'],klasik:['Jaya','Abadi','Sentosa','Makmur','Sejahtera'],unik:['Lab','Verse','Nest','Den','Loft']};
function r(a){return a[Math.floor(Math.random()*a.length)]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
document.getElementById('gen').addEventListener('click',function(){
  var k=document.getElementById('k').value.trim();
  if(!k){document.getElementById('k').focus();SFX.err();return}
  var g=document.getElementById('s').value;
  var out=document.getElementById('out');out.innerHTML='';
  var seen={};
  for(var i=0;i<6;i++){
    var n,t=0;
    do{n=r(P[g])+' '+cap(k)+' '+r(S[g]);t++}while(seen[n]&&t<30);
    seen[n]=1;
    var row=document.createElement('div');row.className='item';
    row.innerHTML='<span></span><button class="cp">Copy</button>';
    row.querySelector('span').textContent=n;
    (function(txt,btn){
      btn.addEventListener('click',function(){
        navigator.clipboard&&navigator.clipboard.writeText(txt);
        btn.textContent='✓';btn.classList.add('ok');SFX.pickup();
        setTimeout(function(){btn.textContent='Copy';btn.classList.remove('ok')},1200);
      });
    })(n,row.querySelector('.cp'));
    out.appendChild(row);
  }
  SFX.win();
});
})();
</script></body></html>
