<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — RubyEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }
  .auth-wrap::before {
    content: '';
    position: absolute;
    top: -40%; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(124,92,255,0.14), transparent 60%);
    pointer-events: none;
  }
  .auth-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: var(--shadow-lg);
  }
  .auth-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
    font-weight: 700;
    font-size: 17px;
  }
  .auth-logo-mark {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; color: #fff; font-size: 17px;
    box-shadow: 0 10px 26px rgba(124,92,255,0.35);
  }
  .auth-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 6px;
  }
  .auth-sub {
    color: var(--text-2);
    font-size: 14px;
    text-align: center;
    margin-bottom: 30px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-1);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 11px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text-0);
    font-size: 14.5px;
    outline: none;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .field input::placeholder { color: var(--text-3); }
  .field input:focus {
    border-color: var(--accent);
    background: var(--bg-3);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .btn-auth {
    width: 100%;
    padding: 13px 16px;
    border-radius: 11px;
    background: #fff;
    color: #0a0b0e;
    font-size: 14.5px;
    font-weight: 600;
    transition: all 0.2s ease;
    cursor: pointer;
    margin-top: 10px;
    font-family: inherit;
  }
  .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(255,255,255,0.14); }
  .btn-auth:active { transform: translateY(0); }

  .auth-error {
    display: none;
    margin-top: 14px;
    padding: 11px 14px;
    border-radius: 10px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    font-size: 13px;
    text-align: center;
    font-weight: 500;
    line-height: 1.5;
  }
  .auth-error.show { display: block; }
  .auth-error strong { color: #fca5a5; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">R</div>
      <div>Ruby<span style="color:var(--text-2); font-weight:500">Engine</span></div>
    </div>

    <h1 class="auth-title">Selamat Datang</h1>
    <p class="auth-sub">Masuk untuk melanjutkan ke RubyEngine</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="user">Username</label>
        <input id="user" type="text" placeholder="Masukkan username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-auth">Masuk</button>
      <div class="auth-error" id="errBox">Username atau password salah.</div>
    </form>
  </div>
</div>

<script src="js/sfx.js"></script>
<script src="js/auth.js"></script>
<script>
  (function () {
    if (Auth.current()) {
      window.location.href = 'home.html';
      return;
    }

    var form = document.getElementById('loginForm');
    var errBox = document.getElementById('errBox');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var u = document.getElementById('user').value.trim();
      var p = document.getElementById('pass').value.trim();

      var res = Auth.login(u, p);

      if (res.ok) {
        window.location.href = 'home.html';
        return;
      }

      var msg = 'Username atau password salah.';
      if (res.reason === 'disabled') {
        msg = 'Akun ini dinonaktifkan oleh admin.';
      } else if (res.reason === 'not_found') {
        msg = 'Akun tidak ditemukan.';
      } else if (res.reason === 'wrong_password') {
        msg = 'Password salah.';
      } else if (res.reason === 'expired') {
        msg = '<strong>Akun kamu sudah expired.</strong><br>Hubungi admin untuk memperpanjang.';
      }

      errBox.innerHTML = msg;
      errBox.classList.add('show');

      if (navigator.vibrate) navigator.vibrate(120);
      if (window.SFX && SFX.err) SFX.err();

      document.getElementById('pass').value = '';
      document.getElementById('pass').focus();
    });

    ['user', 'pass'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        errBox.classList.remove('show');
      });
    });
  })();
</script>
</body>
</html>
