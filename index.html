<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RubyEngine — Platform APK & Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  /* =========================================
     LANDING — RubyEngine
  ========================================= */
  body.landing-body {
    min-height: 100vh;
    background: #05060a;
    overflow-x: hidden;
    position: relative;
  }

  /* Background glow blobs */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .bg-blob.b1 {
    top: -20%; left: 50%;
    transform: translateX(-50%);
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(59,110,255,0.30), transparent 70%);
  }
  .bg-blob.b2 {
    bottom: -25%; left: -10%;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,92,255,0.22), transparent 70%);
  }
  .bg-blob.b3 {
    bottom: -20%; right: -15%;
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(0,180,255,0.20), transparent 70%);
  }

  /* Star particles */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 15% 60%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 92% 12%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 8% 88%, rgba(255,255,255,0.4), transparent);
    opacity: 0.9;
  }

  .landing-shell {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  /* Top brand chip */
  .brand-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    margin-bottom: 28px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    animation: fadeUp 0.6s ease both;
  }
  .brand-chip-mark {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, #5b6dff, #3b82f6);
    display: grid; place-items: center;
    font-weight: 800; font-size: 12px; color: #fff;
    box-shadow: 0 6px 16px rgba(91,109,255,0.45);
  }
  .brand-chip-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
    margin-left: 4px;
  }

  /* Hero card */
  .hero-card {
    position: relative;
    width: 100%;
    max-width: 560px;
    border-radius: 26px;
    padding: 48px 36px 42px;
    background:
      linear-gradient(180deg, rgba(18,22,34,0.85), rgba(10,12,20,0.9));
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    text-align: center;
    overflow: hidden;
    animation: fadeUp 0.7s ease 0.05s both;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -60%; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(91,109,255,0.22), transparent 60%);
    pointer-events: none;
  }

  /* Logo */
  .hero-logo {
    position: relative;
    width: 84px; height: 84px;
    margin: 0 auto 26px;
    border-radius: 22px;
    background: linear-gradient(135deg, #6b7cff 0%, #3b82f6 55%, #2563eb 100%);
    display: grid; place-items: center;
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.04em;
    box-shadow:
      0 20px 45px rgba(59,130,246,0.45),
      inset 0 1px 0 rgba(255,255,255,0.35);
    animation: floatY 4s ease-in-out infinite;
  }
  .hero-logo::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 26px;
    background: conic-gradient(from 0deg, transparent, rgba(91,109,255,0.6), transparent 40%);
    filter: blur(10px);
    z-index: -1;
    animation: spin 6s linear infinite;
  }

  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-title {
    position: relative;
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 1.05;
    color: #fff;
    margin-bottom: 14px;
  }
  .hero-title span {
    background: linear-gradient(90deg, #6b7cff, #3b82f6, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero-desc {
    position: relative;
    font-size: 15px;
    line-height: 1.65;
    color: rgba(255,255,255,0.55);
    max-width: 400px;
    margin: 0 auto 34px;
  }

  /* CTA button */
  .cta-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 34px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #4f6cff 0%, #2563eb 55%, #1d4ed8 100%);
    box-shadow:
      0 14px 34px rgba(37,99,235,0.5),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all 0.22s ease;
    overflow: hidden;
  }
  .cta-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.25), transparent 60%);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 18px 44px rgba(37,99,235,0.65),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .cta-btn:hover::before { transform: translateX(120%); }
  .cta-btn:active { transform: translateY(0); }
  .cta-btn svg { transition: transform 0.22s ease; }
  .cta-btn:hover svg { transform: translateX(3px); }

  /* Footer meta */
  .landing-meta {
    position: relative;
    margin-top: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .landing-meta-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }

  .landing-foot {
    position: relative;
    z-index: 1;
    margin-top: 40px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.28);
    text-align: center;
    animation: fadeUp 0.7s ease 0.15s both;
  }

  @media (max-width: 480px) {
    .hero-card { padding: 40px 26px 34px; border-radius: 22px; }
    .hero-logo { width: 72px; height: 72px; font-size: 32px; border-radius: 20px; }
    .cta-btn { width: 100%; padding: 15px 24px; }
  }
</style>
</head>
<body class="landing-body">

  <!-- Background decor -->
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
  <div class="stars"></div>

  <main class="landing-shell">

    <div class="brand-chip">
      <span class="brand-chip-mark">R</span>
      RubyEngine
      <span class="brand-chip-status"></span>
    </div>

    <section class="hero-card">
      <div class="hero-logo">R</div>

      <h1 class="hero-title">
        Semua APK &amp; Game<br />
        <span>dalam satu tempat.</span>
      </h1>

      <p class="hero-desc">
        Platform kurasi aplikasi Android &amp; game gratis ringan —
        cepat, aman, dan tanpa ribet.
      </p>

      <a href="login.html" class="cta-btn">
        Mulai Sekarang
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </a>

      <div class="landing-meta">
        <span>v1.0</span>
        <span class="landing-meta-dot"></span>
        <span>Dark Edition</span>
        <span class="landing-meta-dot"></span>
        <span>Secure</span>
      </div>
    </section>

    <div class="landing-foot">© 2025 RubyEngine — All rights reserved.</div>

  </main>

  <script src="js/sfx.js"></script>
</body>
</html>
